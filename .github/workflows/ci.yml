name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MF_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Validate benchmark
        run: python -m memoryforge validate
      - name: Tests
        run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: memoryforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MF_OFFLINE: "1"
      MF_DATABASE_URL: postgresql://forge:forge@localhost:5432/memoryforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev,postgres]"
      - name: Smoke benchmark on pgvector
        run: python -m memoryforge bench --seeds 1 --n-train 6 --n-eval 3 --embedder hash
